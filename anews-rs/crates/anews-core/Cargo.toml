[package]
name = "anews-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ruzstd = "0.8"
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
earcut = "0.4"
