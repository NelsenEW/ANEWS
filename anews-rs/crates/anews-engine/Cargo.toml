[package]
name = "anews-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
image = "0.25"
base64 = "0.22"
anews-core = { path = "../anews-core" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
anews-core = { path = "../anews-core" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "test-util"] }
