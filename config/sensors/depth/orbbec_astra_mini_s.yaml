source: >-
  Orbbec Astra Mini S structured-light depth camera, mounted facing forward on
  a restaurant delivery robot. Working range and precision from the datasheet
  (0.35-2.5 m, +-3 mm at 1 m). The datasheet field of view is 60 x 49.5 deg;
  the usable field measured on a deployed robot is 55 x 45.5 deg, because
  structured-light depth loses its border pixels, so that is what is
  simulated. Disparity model from the Astra geometry (75 mm baseline, 570 px
  focal length at 640x480, 1/8 px subpixel). Pipeline: depth 160x120 at
  30 fps, VoxelGrid leaf 0.08 m into /camera/depth/points_stvl, laser
  projection over 0.15-1.2 m height and 0.25-10 m range.
camera:
  model: orbbec_astra_mini_s
  width: 160
  height: 120
  hfov_deg: 55.0
  vfov_deg: 45.5
  range_min_m: 0.35
  range_max_m: 2.5
  rate_hz: 30.0
  noise:
    sigma_at_1m_m: 0.003
    baseline_m: 0.075
    native_focal_px: 570.0
    subpixel: 0.125
pipeline:
  voxel_leaf_m: 0.08
  min_height_m: 0.15
  max_height_m: 1.2
  range_min_m: 0.25
  range_max_m: 10.0
  angle_increment_rad: 0.0087
