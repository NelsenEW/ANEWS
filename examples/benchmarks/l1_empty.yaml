scenario:
  name: l1_empty
  description: >
    L1 Primitive: Robot navigates to a diagonal goal in a large open space
    with no obstacles or walls nearby. Baseline test that isolates pure
    controller dynamics — path smoothness, velocity profile, goal convergence.
    Any oscillation or overshoot here is a controller tuning issue, not
    an obstacle avoidance problem.
  seed: 22
  metadata:
    category: benchmark
    tier: l1_primitive
    difficulty: easy
    tags: [benchmark, l1, empty, baseline, dynamics]

  localization_map: maps/empty.yaml

  robot:
    spawn_pose: [0.0, 0.0, 0.0]
    sensor_profile: default

  goal:
    x: 3.0
    y: 3.0
    tolerance: 0.3
    timeout: 60.0

  furniture: []
  humans: []
  events: []
